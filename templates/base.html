<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="/manifest.json">
  <title>{% block title %}MELB Nutrition{% endblock %}</title>
  <style>
    :root {
      --bg:#0b1220; --card:#111827; --card2:#182235; --text:#f3f4f6; --muted:#9ca3af;
      --border:#2a364b; --accent:#60a5fa; --good:#34d399; --danger:#f87171;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    a { color:inherit; }
    .wrap { max-width:1300px; margin:auto; padding:16px; }
    .topbar { display:flex; gap:12px; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    .brand { font-size:1.35rem; font-weight:800; }
    .nav { display:flex; gap:8px; flex-wrap:wrap; }
    .btn, button {
      border:1px solid var(--border); background:var(--card2); color:var(--text); border-radius:12px;
      padding:10px 14px; font:inherit; font-weight:650; text-decoration:none; cursor:pointer;
    }
    .btn.primary { background:var(--accent); color:#06111f; border-color:var(--accent); }
    .btn.danger { background:transparent; border-color:#7f1d1d; color:#fecaca; }
    .datebar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
    input, select {
      width:100%; border:1px solid var(--border); background:#0f172a; color:var(--text); border-radius:10px; padding:10px;
      font-size:16px;
    }
    .metrics { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin:14px 0; }
    .metric { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; }
    .metric .v { font-size:1.35rem; font-weight:800; }
    .metric .k { color:var(--muted); font-size:.82rem; margin-top:2px; }
    .sections { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:start; }
    .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px; }
    .section h2 { margin:0 0 10px; font-size:1.05rem; }
    .foodrow { padding:12px 0; border-top:1px solid rgba(255,255,255,.05); }
    .foodrow:first-of-type { border-top:0; }
    .fname { overflow-wrap:anywhere; font-size:.92rem; min-width:0; }
    .amount-control { min-width:0; }
    .amount-heading { display:flex; gap:10px; align-items:center; justify-content:space-between; }
    .amount-heading label { flex:1; min-width:0; }
    .amount-exact { display:flex; gap:6px; align-items:center; flex-shrink:0; }
    input.amount-value { width:82px; min-height:44px; padding:8px; text-align:right; font-variant-numeric:tabular-nums; }
    .amount-unit { color:var(--muted); font-size:.8rem; }
    input.amount-range {
      appearance:none; -webkit-appearance:none; display:block; width:100%; min-width:0;
      height:48px; padding:0; margin:4px 0 0; border:0; border-radius:8px;
      background:transparent; cursor:pointer; touch-action:pan-y;
    }
    input.amount-range::-webkit-slider-runnable-track {
      height:8px; border-radius:999px;
      background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--fill,0%),var(--border) var(--fill,0%),var(--border) 100%);
    }
    input.amount-range::-webkit-slider-thumb {
      appearance:none; -webkit-appearance:none; width:32px; height:32px; margin-top:-12px;
      border:3px solid var(--card); border-radius:50%; background:var(--accent); box-shadow:0 0 0 1px var(--accent);
    }
    input.amount-range::-moz-range-track { height:8px; border-radius:999px; background:var(--border); }
    input.amount-range::-moz-range-progress { height:8px; border-radius:999px; background:var(--accent); }
    input.amount-range::-moz-range-thumb {
      width:28px; height:28px; border:3px solid var(--card); border-radius:50%; background:var(--accent);
    }
    input.amount-range:focus-visible, input.amount-value:focus-visible {
      outline:2px solid var(--accent); outline-offset:3px;
    }
    input.amount-range:disabled { opacity:.5; cursor:wait; }
    .range-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-size:.75rem; }
    .serving-control { grid-column:span 2; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin:14px 0; }
    .healthgrid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
    .small { color:var(--muted); font-size:.86rem; }
    .status { color:var(--muted); font-size:.8rem; margin-left:8px; }
    .formgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    label { display:block; color:#d1d5db; font-size:.9rem; }
    label span { display:block; margin-bottom:5px; }
    .notice { padding:10px 12px; border-radius:12px; margin:10px 0; background:#0f2d24; border:1px solid #14532d; }
    .error { background:#331314; border-color:#7f1d1d; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:8px; border-bottom:1px solid var(--border); text-align:left; font-size:.9rem; }
    code { background:#0f172a; padding:2px 5px; border-radius:6px; overflow-wrap:anywhere; }
    @media (max-width:900px) {
      .metrics { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .sections { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .healthgrid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:600px) {
      .wrap { padding:10px; }
      .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .sections { grid-template-columns:1fr; }
      .formgrid { grid-template-columns:1fr; }
      .brand { font-size:1.15rem; }
    }
    [hidden] { display:none !important; }
    button:disabled { opacity:.6; cursor:wait; }
    .panel-title { margin:0; font-size:1.1rem; }
    .food-tabs, .food-actions { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
    .food-tabs [aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
    .lookup-controls { display:flex; align-items:end; gap:10px; }
    .lookup-controls label { flex:1; }
    .lookup-controls button { flex-shrink:0; }
    .food-results { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:12px 0; }
    .food-result { border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--card2); overflow-wrap:anywhere; }
    .food-result p, .day-food-item p { margin:7px 0; }
    .food-editor-heading { font-size:1rem; margin:18px 0 8px; }
    .day-food-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .food-name-field { grid-column:span 2; }
    .food-warning { background:#362b12; border-color:#786023; }
    .food-error { color:#fecaca; }
    .day-food-list { list-style:none; margin:0; padding:0; }
    .day-food-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--border); }
    .day-food-item > div { min-width:0; overflow-wrap:anywhere; }
    .day-food-item > button { flex-shrink:0; }
    @media (max-width:900px) {
      .food-results { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .day-food-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:600px) {
      .lookup-controls { align-items:stretch; flex-direction:column; }
      .food-results, .day-food-grid { grid-template-columns:1fr; }
      .food-name-field, .serving-control { grid-column:auto; }
      .day-food-item { align-items:start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">MELB Nutrition</div>
      <div class="nav">
        <a class="btn" href="/">Today</a>
        <a class="btn" href="/foods">Saved foods</a>
        <a class="btn" href="/settings">Settings</a>
      </div>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
