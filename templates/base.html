<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="/manifest.json">
  <title>{% block title %}MELB Nutrition{% endblock %}</title>
  <style>
    :root {
      --bg:#0b1220; --card:#111827; --card2:#182235; --text:#f3f4f6; --muted:#9ca3af;
      --border:#2a364b; --accent:#60a5fa; --good:#34d399; --danger:#f87171;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    a { color:inherit; }
    .wrap { max-width:1300px; margin:auto; padding:16px; }
    .topbar { display:flex; gap:12px; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    .brand { font-size:1.35rem; font-weight:800; }
    .nav { display:flex; gap:8px; flex-wrap:wrap; }
    .btn, button {
      border:1px solid var(--border); background:var(--card2); color:var(--text); border-radius:12px;
      padding:10px 14px; font:inherit; font-weight:650; text-decoration:none; cursor:pointer;
    }
    .btn.primary { background:var(--accent); color:#06111f; border-color:var(--accent); }
    .btn.danger { background:transparent; border-color:#7f1d1d; color:#fecaca; }
    .datebar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
    input, select {
      width:100%; border:1px solid var(--border); background:#0f172a; color:var(--text); border-radius:10px; padding:10px;
      font-size:16px;
    }
    .metrics { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin:14px 0; }
    .metric { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; }
    .metric .v { font-size:1.35rem; font-weight:800; }
    .metric .k { color:var(--muted); font-size:.82rem; margin-top:2px; }
    .sections { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:start; }
    .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px; }
    .section h2 { margin:0 0 10px; font-size:1.05rem; }
    .foodrow { display:grid; grid-template-columns:minmax(0,1fr) 100px; gap:8px; align-items:center; padding:7px 0; border-top:1px solid rgba(255,255,255,.05); }
    .foodrow:first-of-type { border-top:0; }
    .fname { overflow-wrap:anywhere; font-size:.92rem; }
    .amountwrap { position:relative; }
    .amountwrap input { padding-right:34px; text-align:right; }
    .unit { position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; font-size:.78rem; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin:14px 0; }
    .healthgrid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
    .small { color:var(--muted); font-size:.86rem; }
    .status { color:var(--muted); font-size:.8rem; margin-left:8px; }
    .formgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    label { display:block; color:#d1d5db; font-size:.9rem; }
    label span { display:block; margin-bottom:5px; }
    .notice { padding:10px 12px; border-radius:12px; margin:10px 0; background:#0f2d24; border:1px solid #14532d; }
    .error { background:#331314; border-color:#7f1d1d; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:8px; border-bottom:1px solid var(--border); text-align:left; font-size:.9rem; }
    code { background:#0f172a; padding:2px 5px; border-radius:6px; overflow-wrap:anywhere; }
    @media (max-width:900px) {
      .metrics { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .sections { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .healthgrid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:600px) {
      .wrap { padding:10px; }
      .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .sections { grid-template-columns:1fr; }
      .formgrid { grid-template-columns:1fr; }
      .foodrow { grid-template-columns:minmax(0,1fr) 118px; }
      .brand { font-size:1.15rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">MELB Nutrition</div>
      <div class="nav">
        <a class="btn" href="/">Today</a>
        <a class="btn" href="/foods">Add Food</a>
        <a class="btn" href="/settings">Settings</a>
      </div>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
