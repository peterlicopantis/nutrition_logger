<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="{{ url_for('favicon', v='2') }}" type="image/x-icon" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png', v='2') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png', v='2') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <title>{% block title %}MELB Nutrition{% endblock %}</title>
  <style>
    @font-face {
      font-family:"Inter";
      src:url("{{ url_for('static', filename='fonts/Inter-Variable.ttf') }}") format("truetype");
      font-style:normal;
      font-weight:100 900;
      font-display:swap;
    }
    @font-face {
      font-family:"Inter";
      src:url("{{ url_for('static', filename='fonts/Inter-Italic-Variable.ttf') }}") format("truetype");
      font-style:italic;
      font-weight:100 900;
      font-display:swap;
    }
    :root {
      --bg:#0b1220; --card:#111827; --card2:#182235; --text:#f3f4f6; --muted:#9ca3af;
      --border:#2a364b; --accent:#60a5fa; --good:#34d399; --danger:#f87171;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-optical-sizing:auto; background:var(--bg); color:var(--text); }
    button, input, select, textarea, code, pre { font-family:inherit; }
    a { color:inherit; }
    .wrap {
      max-width:1300px; margin:auto;
      padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px))
        calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    }
    /* Keep scrolling content out of a translucent status area on older installs. */
    body::before {
      content:""; position:fixed; top:0; left:0; right:0;
      height:env(safe-area-inset-top,0px); background:var(--bg);
      pointer-events:none; z-index:100;
    }
    .topbar { display:flex; gap:12px; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    .brand { font-size:1.35rem; font-weight:800; }
    .nav { display:flex; gap:8px; flex-wrap:wrap; }
    .btn, button {
      border:1px solid var(--border); background:var(--card2); color:var(--text); border-radius:12px;
      padding:10px 14px; font:inherit; font-weight:650; text-decoration:none; cursor:pointer;
    }
    .btn.primary { background:var(--accent); color:#06111f; border-color:var(--accent); }
    .btn.danger { background:transparent; border-color:#7f1d1d; color:#fecaca; }
    .datebar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
    .date-controls { display:flex; align-items:center; gap:6px; flex:1; min-width:0; max-width:360px; }
    .date-picker-label { flex:1; min-width:0; }
    .date-arrow { flex-shrink:0; width:44px; height:44px; padding:0; font-size:26px; line-height:1; }
    .dashboard-page .date-controls #dayPicker { width:100%; min-width:0; }
    @media (min-width:1024px) {
      .date-arrow { width:32px; height:28px; font-size:24px; border-radius:8px; }
    }
    @media (min-width:1600px) and (min-height:900px) {
      .date-arrow { width:38px; height:34px; }
    }
    @media (pointer:coarse) {
      .date-arrow { min-width:44px; min-height:44px; }
    }
    input, select {
      width:100%; border:1px solid var(--border); background:#0f172a; color:var(--text); border-radius:10px; padding:10px;
      font-size:16px;
    }
    .metrics { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin:14px 0; }
    .metric { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; }
    .metric .v { font-size:1.35rem; font-weight:800; }
    .metric .k { color:var(--muted); font-size:.82rem; margin-top:2px; }
    .sections { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:start; }
    .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px; }
    .section h2 { margin:0 0 10px; font-size:1.05rem; }
    .foodrow { padding:12px 0; border-top:1px solid rgba(255,255,255,.05); }
    .foodrow:first-of-type { border-top:0; }
    .fname { overflow-wrap:anywhere; font-size:.92rem; min-width:0; }
    .amount-control { min-width:0; }
    .amount-heading { display:flex; gap:10px; align-items:center; justify-content:space-between; }
    .amount-heading label { flex:1; min-width:0; }
    .amount-exact { display:flex; gap:6px; align-items:center; flex-shrink:0; }
    input.amount-value { width:82px; min-height:44px; padding:8px; text-align:right; font-variant-numeric:tabular-nums; }
    .amount-unit { color:var(--muted); font-size:.8rem; }
    input.amount-range {
      appearance:none; -webkit-appearance:none; display:block; width:100%; min-width:0;
      height:48px; padding:0; margin:4px 0 0; border:0; border-radius:8px;
      background:transparent; cursor:pointer; touch-action:pan-y;
    }
    input.amount-range::-webkit-slider-runnable-track {
      height:8px; border-radius:999px;
      background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--fill,0%),var(--border) var(--fill,0%),var(--border) 100%);
    }
    input.amount-range::-webkit-slider-thumb {
      appearance:none; -webkit-appearance:none; width:32px; height:32px; margin-top:-12px;
      border:3px solid var(--card); border-radius:50%; background:var(--accent); box-shadow:0 0 0 1px var(--accent);
    }
    input.amount-range::-moz-range-track { height:8px; border-radius:999px; background:var(--border); }
    input.amount-range::-moz-range-progress { height:8px; border-radius:999px; background:var(--accent); }
    input.amount-range::-moz-range-thumb {
      width:28px; height:28px; border:3px solid var(--card); border-radius:50%; background:var(--accent);
    }
    input.amount-range:focus-visible, input.amount-value:focus-visible {
      outline:2px solid var(--accent); outline-offset:3px;
    }
    input.amount-range:disabled { opacity:.5; cursor:wait; }
    .range-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-size:.75rem; }
    .serving-control { grid-column:span 2; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin:14px 0; }
    .healthgrid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
    .small { color:var(--muted); font-size:.86rem; }
    .status { color:var(--muted); font-size:.8rem; margin-left:8px; }
    .formgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    label { display:block; color:#d1d5db; font-size:.9rem; }
    label span { display:block; margin-bottom:5px; }
    .notice { padding:10px 12px; border-radius:12px; margin:10px 0; background:#0f2d24; border:1px solid #14532d; }
    .error { background:#331314; border-color:#7f1d1d; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:8px; border-bottom:1px solid var(--border); text-align:left; font-size:.9rem; }
    code { background:#0f172a; padding:2px 5px; border-radius:6px; overflow-wrap:anywhere; }
    @media (max-width:900px) {
      .metrics { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .sections { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .healthgrid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:600px) {
      .wrap { padding:10px; }
      .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .sections { grid-template-columns:1fr; }
      .formgrid { grid-template-columns:1fr; }
      .brand { font-size:1.15rem; }
    }
    [hidden] { display:none !important; }
    button:disabled { opacity:.6; cursor:wait; }
    .panel-title { margin:0; font-size:1.1rem; }
    .food-tabs, .food-actions { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
    .food-tabs [aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
    .phone-food-scan { display:none; }
    .food-scan-actions { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
    .food-scan-actions .btn { min-height:44px; }
    .food-scan-status { margin:8px 0; overflow-wrap:anywhere; }
    .food-live-camera { padding:10px; margin:10px 0; border:1px solid var(--border); border-radius:12px; }
    .food-live-camera .btn { min-height:44px; }
    .food-camera-view { position:relative; background:#000; border-radius:8px; overflow:hidden; }
    .food-camera-view video { display:block; width:100%; max-height:52svh; aspect-ratio:3 / 4; object-fit:contain; }
    .food-camera-guide { position:absolute; inset:8%; border:2px solid var(--accent); border-radius:10px; pointer-events:none; }
    .food-scan-photo-options { margin:8px 0; font-size:13px; }
    .food-scan-photo-options summary { cursor:pointer; padding:8px 0; color:var(--muted); }
    .food-scan-text { margin:10px 0; font-size:13px; }
    .food-scan-text summary { cursor:pointer; padding:8px 0; }
    .food-scan-text pre { max-height:200px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; color:var(--muted); }
    @media (max-width:600px), (max-width:900px) and (pointer:coarse) {
      .phone-food-scan { display:block; }
    }
    .lookup-controls { display:flex; align-items:end; gap:10px; }
    .lookup-controls label { flex:1; }
    .lookup-controls button { flex-shrink:0; }
    .food-results { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:12px 0; }
    .food-result { border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--card2); overflow-wrap:anywhere; }
    .food-result p, .day-food-item p { margin:7px 0; }
    .food-editor-heading { font-size:1rem; margin:18px 0 8px; }
    .portion-controls { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:12px 0; }
    .portion-controls > p { grid-column:1 / -1; margin:0; }
    @media (max-width:600px) {
      .portion-controls { grid-template-columns:1fr; }
      .portion-controls input, .portion-controls select { min-height:44px; font-size:16px; }
    }
    .day-food-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .food-name-field { grid-column:span 2; }
    .food-warning { background:#362b12; border-color:#786023; }
    .food-error { color:#fecaca; }
    .custom-food-history { margin:12px 0; border-top:1px solid var(--border); padding-top:10px; }
    .custom-food-history > summary { cursor:pointer; color:var(--accent); font-size:14px; font-weight:650; }
    .custom-food-history > summary .small { margin-left:6px; font-weight:400; }
    .history-search-label { display:block; max-width:440px; }
    .food-history-list { list-style:none; padding:0; margin:8px 0; max-height:280px; overflow-y:auto; }
    .food-history-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--border); }
    .food-history-item > div:first-child { min-width:0; overflow-wrap:anywhere; }
    .food-history-item p { margin:4px 0; }
    .food-history-actions, .day-food-actions { display:flex; flex:0 0 auto; align-items:center; gap:6px; flex-wrap:wrap; }
    .day-food-actions { margin-left:auto; }
    @media (max-width:600px), (max-width:900px) and (pointer:coarse) {
      .custom-food-history > summary { min-height:44px; padding:10px 0; }
      .history-search-label input, .food-history-actions button, .day-food-actions button { min-height:44px; }
      .food-history-item, .day-food-item { flex-wrap:wrap; }
      .food-history-actions { margin-left:auto; }
    }

    .day-food-list { list-style:none; margin:0; padding:0; }
    .day-food-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--border); }
    .day-food-item > div { min-width:0; overflow-wrap:anywhere; }
    .day-food-item > button { flex-shrink:0; }
    @media (max-width:900px) {
      .food-results { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .day-food-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:600px) {
      .lookup-controls { align-items:stretch; flex-direction:column; }
      .food-results, .day-food-grid { grid-template-columns:1fr; }
      .food-name-field, .serving-control { grid-column:auto; }
      .day-food-item { align-items:start; }
    }
    .dashboard-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .health-export-note { margin-bottom:14px; }
    .desktop-only { display:none; }
    .day-food-panel > summary { display:block; list-style:none; cursor:pointer; font-weight:700; }
    .day-food-panel > summary::-webkit-details-marker { display:none; }
    .snapshot-heading { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; list-style:none; cursor:pointer; }
    .snapshot-heading::-webkit-details-marker { display:none; }
    @media (min-width:1024px) {
      .dashboard-page .wrap { max-width:1600px; padding:10px 12px; }
      .dashboard-page .topbar { margin-bottom:6px; gap:8px; }
      .dashboard-page .brand { font-size:1.1rem; }
      .dashboard-page .nav { gap:6px; }
      .dashboard-page .btn { padding:5px 10px; border-radius:8px; font-size:12px; }
      .dashboard-page .datebar { margin-bottom:6px; gap:8px; }
      .dashboard-page .datebar label { display:flex; align-items:center; gap:8px; font-size:12px; }
      .dashboard-page .datebar label span { margin:0; }
      .dashboard-page #dayPicker { width:150px; padding:4px 7px; height:28px; font-size:12px; }
      .dashboard-page .status { font-size:11px; }
      .dashboard-page .metrics { gap:6px; margin:6px 0; }
      .dashboard-page .metrics .metric { display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:6px 9px; border-radius:8px; }
      .dashboard-page .metrics .v { font-size:18px; }
      .dashboard-page .metrics .k { margin:0; font-size:11px; white-space:nowrap; }
      .dashboard-page .dashboard-actions { gap:6px; margin-bottom:4px; }
      .dashboard-page .health-export-note { margin-bottom:6px; font-size:10px; line-height:14px; }
      .dashboard-page #fiberNotice { margin:4px 0; font-size:11px; }
      .dashboard-page .day-food-panel, .dashboard-page .health-panel { margin:6px 0; padding:7px 10px; border-radius:8px; }
      .dashboard-page .day-food-panel > summary, .dashboard-page .snapshot-heading { font-size:12px; line-height:18px; }
      .dashboard-page .day-food-panel > summary::before, .dashboard-page .snapshot-heading::before { content:"\25B8"; color:var(--accent); margin-right:7px; }
      .dashboard-page .day-food-panel[open] > summary::before, .dashboard-page .health-panel[open] > summary::before { content:"\25BE"; }
      .dashboard-page .desktop-only { display:inline; }
      .dashboard-page #dayFoodCount { margin-left:8px; font-weight:400; font-size:11px; }
      .dashboard-page .snapshot-heading { justify-content:flex-start; flex-wrap:nowrap; gap:0; }
      .dashboard-page .snapshot-heading > .small { margin-left:auto; font-size:10px; }
      .dashboard-page .sections { grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:8px; }
      .dashboard-page .section { padding:6px 8px; border-radius:8px; min-width:0; }
      .dashboard-page .section h2 { font-size:13px; line-height:18px; margin:0 0 4px; }
      .dashboard-page .foodrow { display:grid; grid-template-columns:minmax(0,1fr) minmax(62px,1.15fr) 74px; grid-template-areas:"name slider amount"; align-items:center; gap:6px; height:26px; padding:0; border-top:0; }
      .dashboard-page .foodrow .amount-heading { display:contents; }
      .dashboard-page .foodrow .fname { grid-area:name; font-size:12px; line-height:18px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .dashboard-page .foodrow .amount-exact { grid-area:amount; justify-content:flex-end; gap:3px; min-width:0; }
      .dashboard-page .foodrow input.amount-value { width:50px; min-height:22px; height:22px; border-radius:5px; padding:2px 4px; font-size:12px; }
      .dashboard-page .foodrow .amount-unit { font-size:10px; }
      .dashboard-page .foodrow input.amount-range { grid-area:slider; height:24px; margin:0; border-radius:5px; }
      .dashboard-page .foodrow input.amount-range::-webkit-slider-runnable-track { height:4px; }
      .dashboard-page .foodrow input.amount-range::-webkit-slider-thumb { width:14px; height:14px; margin-top:-5px; border-width:2px; }
      .dashboard-page .foodrow input.amount-range::-moz-range-track, .dashboard-page .foodrow input.amount-range::-moz-range-progress { height:4px; }
      .dashboard-page .foodrow input.amount-range::-moz-range-thumb { width:10px; height:10px; border-width:2px; }
      .dashboard-page .foodrow .range-footer { display:none; }
      @media (max-height:800px) {
        .dashboard-page .foodrow { height:24px; }
      }
    }
    @media (min-width:1600px) and (min-height:900px) {
      .dashboard-page {
        --desktop-label-size:clamp(14px,.75vw,17px);
        --desktop-exact-width:clamp(60px,3.1vw,80px);
        --desktop-thumb-size:clamp(18px,1.6vh,22px);
      }
      .dashboard-page .wrap { max-width:2200px; padding:16px 20px; }
      .dashboard-page .topbar { margin-bottom:10px; }
      .dashboard-page .brand { font-size:clamp(20px,1vw,26px); }
      .dashboard-page .nav { gap:8px; }
      .dashboard-page .btn { padding:7px 12px; font-size:clamp(13px,.7vw,16px); border-radius:9px; }
      .dashboard-page .datebar { margin-bottom:8px; gap:12px; }
      .dashboard-page .datebar label { font-size:14px; gap:10px; }
      .dashboard-page #dayPicker { width:180px; height:34px; padding:6px 10px; font-size:14px; }
      .dashboard-page .status { font-size:13px; }
      .dashboard-page .metrics { gap:10px; margin:8px 0; }
      .dashboard-page .metrics .metric { padding:8px 12px; border-radius:10px; }
      .dashboard-page .metrics .v { font-size:clamp(24px,1.1vw,28px); }
      .dashboard-page .metrics .k { font-size:clamp(12px,.65vw,15px); }
      .dashboard-page .dashboard-actions { gap:8px; margin-bottom:6px; }
      .dashboard-page .health-export-note { font-size:12px; line-height:17px; margin-bottom:8px; }
      .dashboard-page #fiberNotice { font-size:13px; }
      .dashboard-page .day-food-panel, .dashboard-page .health-panel { margin:8px 0; padding:10px 14px; border-radius:10px; }
      .dashboard-page .day-food-panel > summary, .dashboard-page .snapshot-heading { font-size:15px; line-height:21px; }
      .dashboard-page #dayFoodCount { font-size:13px; margin-left:10px; }
      .dashboard-page .snapshot-heading > .small { font-size:12px; }
      .dashboard-page .sections { gap:12px; margin-top:12px; }
      .dashboard-page .section { padding:10px 12px; border-radius:10px; }
      .dashboard-page .section h2 { font-size:clamp(16px,.95vw,20px); line-height:24px; margin-bottom:6px; }
      .dashboard-page .foodrow {
        grid-template-columns:minmax(0,1fr) minmax(84px,1.15fr) calc(var(--desktop-exact-width) + 32px);
        gap:10px; height:clamp(28px,3.2vh,42px);
      }
      .dashboard-page .foodrow .fname { font-size:var(--desktop-label-size); line-height:22px; }
      .dashboard-page .foodrow .amount-exact { gap:4px; }
      .dashboard-page .foodrow input.amount-value {
        width:var(--desktop-exact-width); min-height:24px; height:clamp(24px,2.4vh,32px);
        padding:3px 5px; font-size:var(--desktop-label-size); border-radius:6px;
      }
      .dashboard-page .foodrow .amount-unit { font-size:clamp(11px,.55vw,14px); }
      .dashboard-page .foodrow input.amount-range { height:clamp(26px,2.8vh,36px); }
      .dashboard-page .foodrow input.amount-range::-webkit-slider-runnable-track { height:6px; }
      .dashboard-page .foodrow input.amount-range::-webkit-slider-thumb {
        width:var(--desktop-thumb-size); height:var(--desktop-thumb-size);
        margin-top:calc((6px - var(--desktop-thumb-size)) / 2);
      }
      .dashboard-page .foodrow input.amount-range::-moz-range-track,
      .dashboard-page .foodrow input.amount-range::-moz-range-progress { height:6px; }
      .dashboard-page .foodrow input.amount-range::-moz-range-thumb {
        width:calc(var(--desktop-thumb-size) - 4px); height:calc(var(--desktop-thumb-size) - 4px);
      }
    }
    @media (min-width:1600px) and (min-height:900px) and (max-height:999px) {
      .dashboard-page .wrap { padding-top:10px; padding-bottom:10px; }
      .dashboard-page .topbar { margin-bottom:8px; }
      .dashboard-page .day-food-panel, .dashboard-page .health-panel { padding-top:8px; padding-bottom:8px; }
      .dashboard-page .section { padding-top:8px; padding-bottom:8px; }
      .dashboard-page .foodrow { height:clamp(26px,3vh,30px); }
    }
    @media (max-width:600px), (max-width:900px) and (pointer:coarse) {
      .wrap {
        padding:calc(12px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px))
          calc(12px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
      }
      .topbar { gap:8px; margin-bottom:10px; }

      .dashboard-page .mobile-food-tabs {
        position:sticky; top:calc(var(--mobile-summary-height,140px) + env(safe-area-inset-top));
        z-index:19; background:var(--bg); margin:12px 0 0; padding:6px 0;
        scroll-margin-top:calc(var(--mobile-summary-height,140px) + env(safe-area-inset-top));
      }
      .dashboard-page.mobile-typing .mobile-food-tabs { position:static; }
      .dashboard-page .sections, .dashboard-page .foodrow {
        scroll-margin-top:calc(var(--mobile-summary-height,140px) + env(safe-area-inset-top) + 64px);
      }
    }
    .food-category-title, .section h2 { overflow-wrap:anywhere; }
    .food-category-move select { min-width:0; }
    .checkbox-food-note { display:block; color:var(--muted); font-size:11px; line-height:1.5; margin-top:5px; }
    .dashboard-page .foodrow.checkbox-food-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(110px,1fr); grid-template-areas:"name choice"; align-items:center; min-height:44px; }
    .dashboard-page .checkbox-food-row .amount-heading { display:contents; }
    .dashboard-page .checkbox-food-row .fname { grid-area:name; }
    .dashboard-page .checkbox-food-row .amount-exact { grid-area:choice; display:flex; justify-content:flex-start; gap:8px; }
    .dashboard-page .checkbox-food-row .food-checkbox { width:20px; height:20px; min-width:20px; min-height:20px; margin:0; padding:0; accent-color:var(--accent); cursor:pointer; }
    .checkbox-portion { margin:0; min-width:0; font-size:11px; overflow-wrap:anywhere; cursor:pointer; }
    @media (min-width:1024px) {
      .dashboard-page .foodrow.checkbox-food-row { min-height:28px; height:auto; }
      .dashboard-page .foodrow.checkbox-food-row.rice-salt-row { min-height:44px; }
    }
    @media (max-width:600px), (max-width:900px) and (pointer:coarse) {
      .checkbox-portion { display:flex; align-items:center; min-height:44px; }
      .dashboard-page .checkbox-food-row .fname { min-height:44px; display:flex; flex-direction:column; justify-content:center; }
    }
    .day-lock-notice { color:#bfdbfe; margin:6px 0 10px; }
    .food-input:disabled, .foodrow .amount-range:disabled { opacity:.65; cursor:not-allowed; }
    #dayLockButton[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">MELB Nutrition</div>
      <div class="nav">
        <a class="btn" href="/">Today</a>
        <a class="btn" href="/foods">Saved foods</a>
        <a class="btn" href="/settings">Settings</a>
      </div>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
